name: verificar
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Prepara la versión fija
        run: bash script/aplicar.sh "$(cat VERSION | tr -d '\r\n')" upstream
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: upstream/package.json
      - name: Dependencias
        working-directory: upstream
        run: |
          python -m pip install setuptools
          bun install --frozen-lockfile
      - name: Pruebas y tipos
        working-directory: upstream
        run: bash ../script/probar.sh
      - name: Revisión completa de OpenCode
        if: runner.os == 'Linux'
        working-directory: upstream
        run: bun run check
